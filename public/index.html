<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MKDAI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="logo-mark">✦</div>
      <h1>MKDAI</h1>
    </header>
    <p class="tagline">Tell it what you want done. It searches, reads, browses, and acts for you.</p>

    <section class="composer">
      <div class="composer-row">
        <textarea id="goalInput" placeholder="e.g. Find remote frontend developer jobs posted this week and list the best 5 with links&#10;e.g. https://example.com/article — summarize this&#10;e.g. Attach a file below and ask me to summarize it"></textarea>
        <button id="micBtn" title="Speak your goal">🎤</button>
      </div>

      <div class="file-row">
        <label for="fileInput" class="file-label">📎 Attach a file (optional)</label>
        <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.log" />
        <span id="fileName"></span>
      </div>

      <button id="runBtn">Run</button>
    </section>

    <section id="status" class="status hidden">
      <div class="spinner"></div>
      <ul id="stepsList"></ul>
    </section>

    <section class="results">
      <h2>Results</h2>
      <div id="resultsList"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
